<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="AI Strategy & Consultancy - Prosop.ai">
    <title>AI Strategy & Consultancy - Prosop.ai</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="images/Favicon Transparent.ico">
    <link rel="icon" type="image/png" href="images/Original Logo Symbol.png">
</head>
<body>
    <!-- Header with Logo and Menu Button -->
    <header class="header">
        <div class="logo">
            <a href="index.html">
                <img src="images/cropped_transparent_logo_white_letters.png" alt="Prosop.ai Logo" style="height: 60px; width: auto;">
            </a>
        </div>
        <button class="menu-toggle" id="menuToggle" aria-label="Toggle menu">
            <span class="hamburger"></span>
            <span class="hamburger"></span>
            <span class="hamburger"></span>
        </button>
    </header>

    <!-- Slide-out Menu -->
    <nav class="slide-menu" id="slideMenu">
        <button class="menu-close" id="menuClose" aria-label="Close menu">&times;</button>
        <ul class="menu-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="index.html#projects">What We Do</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="index.html#contact">Contact</a></li>
        </ul>
    </nav>

    <!-- Menu Overlay -->
    <div class="menu-overlay" id="menuOverlay"></div>

    <!-- Hero Section with Cropped Video -->
    <section id="strategy-hero" class="hero hero-cropped">
        <div class="hero-video-wrapper">
            <video class="hero-video hero-video-cropped" autoplay muted loop playsinline>
                <source src="images/Owl_Programs_on_Laptop_Flies_Away_cropped.mp4" type="video/mp4">
                Your browser does not support the video tag.
            </video>
        </div>
        <div class="container">
            <div class="hero-value-prop">
                <h1>AI for forward thinkers</h1>
                <p class="hero-subtitle"><span class="subtitle-strategy">Strategy.</span> <span class="subtitle-development">Development.</span> <span class="subtitle-delivered">Delivered.</span></p>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-section">
                    <div class="footer-logo">
                        <img src="images/cropped_transparent_logo_white_letters.png" alt="Prosop.ai Logo" style="height: 60px; width: auto; margin-bottom: 1rem;">
                    </div>
                    <p>Designing intelligent systems one project at a time.</p>
                </div>
                <div class="footer-section">
                    <h4>Quick Links</h4>
                    <ul>
                        <li><a href="index.html">Home</a></li>
                        <li><a href="index.html#projects">What We Do</a></li>
                        <li><a href="about.html">About</a></li>
                        <li><a href="index.html#contact">Contact</a></li>
                    </ul>
                </div>
                <div class="footer-section">
                    <h4>Connect</h4>
                    <ul class="social-links">
                        <li><a href="#">LinkedIn</a></li>
                        <li><a href="#">Email</a></li>
                    </ul>
                </div>
            </div>
            <div class="footer-bottom">
                <p>&copy; 2025 Prosop.ai. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <!-- JavaScript for Menu Toggle -->
    <script>
        const menuToggle = document.getElementById('menuToggle');
        const menuClose = document.getElementById('menuClose');
        const slideMenu = document.getElementById('slideMenu');
        const menuOverlay = document.getElementById('menuOverlay');
        const menuLinks = document.querySelectorAll('.menu-links a');

        function openMenu() {
            slideMenu.classList.add('active');
            menuOverlay.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeMenu() {
            slideMenu.classList.remove('active');
            menuOverlay.classList.remove('active');
            document.body.style.overflow = '';
        }

        menuToggle.addEventListener('click', openMenu);
        menuClose.addEventListener('click', closeMenu);
        menuOverlay.addEventListener('click', closeMenu);

        // Close menu when clicking on a link
        menuLinks.forEach(link => {
            link.addEventListener('click', closeMenu);
        });

        // Close menu with Escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && slideMenu.classList.contains('active')) {
                closeMenu();
            }
        });
    </script>
</body>
</html>
